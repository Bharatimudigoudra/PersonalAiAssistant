application:
  name: PersonalAiAssistant
  author: Bharati
  version: "1.0.0"
  environment: development
  debug: true

llm:
  provider: ollama
  model_name: qwen3:4b
  base_url: http://localhost:11434

  # LLM generation settings
  temperature: 0.1
  max_tokens: 512
  timeout: 180

  # Streaming support
  streaming: true

embedding:
  provider: huggingface
  model_name: BAAI/bge-small-en-v1.5
  device: cpu
  normalize_embeddings: true

vectorstore:
  provider: chroma
  persist_directory: data/vectorstore
  collection_name: personal_ai

rag:
  # Document chunking
  chunk_size: 1000
  chunk_overlap: 200

  # Retrieval
  top_k: 8

  # IMPORTANT:
  # Chroma returns distance values.
  # Do not use this value as a hard semantic-quality
  # threshold unless the retrieval code explicitly
  # interprets it correctly.
  similarity_threshold: 0.0

  # Maximum reference context sent to the LLM
  max_context_chars: 3000
  candidate_multiplier: 4
  max_rerank_candidates: 16

reranker:
  enabled: true
  model_name: BAAI/bge-reranker-base
  top_k: 3

memory:
  max_history: 20

speech:
  whisper_model: base
  piper_voice: en_US-lessac-medium

logging:
  level: INFO
  log_file: logs/personal_ai_assistant.log

api:
  host: 127.0.0.1
  port: 8000

whisper:
  model_name: base
  device: cpu
  compute_type: int8